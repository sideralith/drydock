# CI workflow for drydock
#
# Two jobs:
#   lint — runs shellcheck on bin/drydock (fast static analysis gate)
#   test — runs the bats characterization suite (requires lint to pass first)
#
# Vendored bats-support and bats-assert are already in test/test_helper/,
# so the bats-action only needs to install the runner itself.

name: CI

on:
  push:
    # dev is the integration branch: two individually-green PRs can land on it
    # and break it silently until the release PR — run CI on dev pushes too.
    branches: [main, dev]
  pull_request: {}

jobs:
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck bin/drydock, lib/*.sh, scripts/*.sh, templates/hooks/*.sh, install.sh, and test/integration/*.sh
        run: shellcheck bin/drydock lib/*.sh scripts/*.sh templates/hooks/*.sh install.sh test/integration/test_projects_submount.sh

      - name: Install shfmt (checksum-verified)
        run: |
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64" \
            -o /usr/local/bin/shfmt
          # Official checksum from the v3.8.0 release's sha256sums.txt asset.
          echo "27b3c6f9d9592fc5b4856c341d1ff2c88856709b9e76469313642a1d7b558fe0  /usr/local/bin/shfmt" | sha256sum -c -
          chmod +x /usr/local/bin/shfmt
          shfmt --version

      - name: shfmt format check (bin/drydock, lib/, scripts/, templates/hooks/, and install.sh)
        run: shfmt -d bin/drydock lib/ scripts/ templates/hooks/ install.sh

  test:
    name: Test (bats)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install bats runner
        # Pinned to the commit behind the mutable 3.0.0 tag.
        uses: bats-core/bats-action@2104b40bb7b6c2d5110b23a26b0bf265ab8027db # 3.0.0
        with:
          # Helpers are vendored under test/test_helper/ — do not auto-install.
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run bats suite
        run: scripts/test.sh

  commit-lint:
    name: Lint (commit-message)
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for base..HEAD range

      - name: Lint PR commit subjects
        run: scripts/lint-commits.sh --base "${{ github.event.pull_request.base.sha }}"
