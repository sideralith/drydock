# Smoke workflow for drydock
#
# Runs on every push to main and on PRs that touch Dockerfile, compose files,
# or the CLI code (bin/ / lib/). Does NOT run on a schedule — it's a build
# and CLI reachability check, not a health monitor.
#
# Smoke does NOT run `drydock run` — that needs a host-mounted `claude` binary
# and a real `network_mode: host`; smoke only proves the image builds and the
# CLI runs.

name: Smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - "docker-compose*.yml"
      - "bin/**"
      - "lib/**"
      - "templates/managed-settings.d/**"
      - "templates/hooks/**"
      - "templates/zellij/**"
      - "scripts/test.sh"
      - "test/managed_settings.bats"
      - ".github/workflows/smoke.yml"

jobs:
  smoke:
    name: Smoke (build + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: bin/drydock build

      - name: Verify version command
        run: bin/drydock version

      - name: Run doctor (missing host state is expected on GHA runner)
        # ~/.claude-container* and $PWD/.claude won't exist on a fresh runner —
        # doctor prints "missing" for those checks but exits 0. The '|| true'
        # guards against any set -euo pipefail interaction with missing paths
        # that might surface as a non-zero exit on the runner.
        run: bin/drydock doctor || true

      - name: Run managed-settings integration tests against built image
        # The T19 family in test/managed_settings.bats verifies drydock's INV-3
        # managed-settings bake: presence + JSON-validity of all six drop-ins,
        # root ownership of the bake target, and the 00-secrets.json deny-rule
        # contract (agent cannot rewrite the bake). These tests run
        # `docker run --rm drydock:latest
        # cat <file>` — DooD-safe, no network_mode:host dependency, so they
        # work in GHA. The DRYDOCK_INTEGRATION=1 flag unmasks T5 + T19 family;
        # all other bats tests are unit-mode and CI runs them in ci.yml.
        # Scope is the single file (not test/) — smoke is post-build bake
        # verification, not a unit re-run.
        env:
          DRYDOCK_INTEGRATION: "1"
        run: scripts/test.sh test/managed_settings.bats

      - name: Verify Zellij binary is present in image
        # Confirms the sha256-pinned Zellij install landed in /usr/local/bin/
        # and responds to --version. Catches tarball-fetch or pin-mismatch
        # failures that would make sighup_survival.bats impossible to pass.
        run: docker run --rm drydock:latest zellij --version

      - name: Verify stealth config is baked into image
        # Confirms /etc/drydock/zellij-nested.kdl exists in the image.
        # This file is root-owned (non-root agent cannot overwrite it) and
        # loaded by drydock-wrapper.sh when DRYDOCK_NESTED_ZELLIJ=1.
        run: docker run --rm drydock:latest test -f /etc/drydock/zellij-nested.kdl

      - name: Validate hardening overlay YAML (compose config)
        # Renders the full -f chain (base + hardening overlay) and exits 0
        # only if the merged YAML is syntactically valid. Catches YAML typos
        # in docker-compose.hardening.yml and env-var substitution regressions
        # in DRYDOCK_TMPFS_SIZE.
        run: |
          USER_NAME="$(id -un)" \
          USER_UID="$(id -u)" \
          USER_GID="$(id -g)" \
          HOST_DOCKER_GID=1001 \
          PROJECT_DIR="$GITHUB_WORKSPACE" \
          PROJECT_NAME="drydock-smoke" \
          DRYDOCK_DISCRIMINATOR="smoke" \
          DRYDOCK_SESSION_CLAUDE_DIR="$HOME/.claude-container-smoke" \
          DRYDOCK_SESSION_CLAUDE_JSON="$HOME/.claude-container-smoke.json" \
          DRYDOCK_SESSION_HOOKS_DIR="$HOME/.claude-container-smoke/drydock-hooks" \
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.hardening.yml \
            config >/dev/null

      - name: Validate base compose renders alone (overlay-removed path)
        # Confirms docker-compose.yml is valid as a standalone file (no overlays),
        # so the runtime opt-out path (DRYDOCK_NO_HARDENING=1, which drops the
        # hardening overlay from `compose_files()`) cannot land in a broken state.
        # Gate semantics themselves are covered by bats tests in test/lib_compose.bats.
        run: |
          USER_NAME="$(id -un)" \
          USER_UID="$(id -u)" \
          USER_GID="$(id -g)" \
          HOST_DOCKER_GID=1001 \
          PROJECT_DIR="$GITHUB_WORKSPACE" \
          PROJECT_NAME="drydock-smoke" \
          DRYDOCK_DISCRIMINATOR="smoke" \
          DRYDOCK_SESSION_CLAUDE_DIR="$HOME/.claude-container-smoke" \
          DRYDOCK_SESSION_CLAUDE_JSON="$HOME/.claude-container-smoke.json" \
          DRYDOCK_SESSION_HOOKS_DIR="$HOME/.claude-container-smoke/drydock-hooks" \
          docker compose \
            -f docker-compose.yml \
            config >/dev/null
