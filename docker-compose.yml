# drydock — base compose (project-agnostic).
#
# Invoked via the `drydock` CLI, NOT directly. The CLI sets the required env
# vars (via export_compose_env / build args) and optionally overlays the docs
# compose fragment if the target project has a docs/ directory.
#
# Required env vars (set by the drydock CLI):
#   PROJECT_DIR     Absolute path to the project root (e.g. /home/<you>/git/foo)
#   PROJECT_NAME    Basename of PROJECT_DIR, used for container name uniqueness
#   USER_NAME       Invoking host user (id -un) — drives the container user/$HOME
#   HOME            Host home directory (ambient) — root of every host bind path
#
# Optional env vars (forwarded from the invoking shell if set; not required):
#   GITHUB_PERSONAL_ACCESS_TOKEN   Read by the GitHub MCP server / `gh` PAT auth
#                                  inside the container. See the `environment:` block.

services:
  drydock:
    build:
      context: .
      args:
        # No default — a bare `docker compose build` outside the CLI must fail
        # loudly rather than bake a broken (empty-user) image.
        USER_NAME: "${USER_NAME:?USER_NAME not set — invoke via the drydock CLI}"
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
        HOST_DOCKER_GID: "${HOST_DOCKER_GID:-1001}"
    image: drydock:latest
    container_name: "drydock-${PROJECT_NAME}-${DRYDOCK_DISCRIMINATOR:?DRYDOCK_DISCRIMINATOR not set — invoke via the drydock CLI}"

    # Share host network namespace. Lets `curl http://localhost:PORT/...` work
    # identically to host-side, and lets the container reach sibling
    # docker-compose stacks via their published host ports.
    network_mode: host

    stdin_open: true
    tty: true
    # Tini as PID 1 (#112). Reaps zombies + forwards signals correctly. NOT a
    # full fix on its own — the kernel still tears down the PID namespace when
    # tini exits with its main child. The actual fix for #112 is the supervisor
    # model used by cmd_run / _launch_new (sleep infinity as the main child of
    # tini, claude attached via `compose exec`); see lib/commands.sh nested
    # path. Tini is complementary: zombie reaping under either model + cleaner
    # exit logs when claude does crash.
    init: true
    working_dir: "${PROJECT_DIR}"

    # ── Env passthrough ──────────────────────────────────────────────────────
    # The GitHub MCP server (and `gh` PAT auth) read GITHUB_PERSONAL_ACCESS_TOKEN
    # from the process environment. `docker compose run` does NOT inherit the host
    # env, so forward it explicitly: the container sees it iff the shell that
    # invoked drydock had it set. (~/.config/gh is already mounted RW below — this
    # widens nothing; the agent could already `gh auth token`.)
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - DRYDOCK
      - DRYDOCK_VERSION

    volumes:
      # ── Docker-out-of-Docker socket ────────────────────────────────────────
      - /var/run/docker.sock:/var/run/docker.sock

      # ── Project tree (same path inside as outside so Makefile resolves) ────
      - "${PROJECT_DIR}:${PROJECT_DIR}:rw"

      # ── Claude state: per-session isolated ────────────────────────────────
      # Two locations Claude Code reads config from:
      #   ~/.claude/      — directory: skills, plugins, settings.json, CLAUDE.md, hooks
      #   ~/.claude.json  — single file: project list, onboarding flags, MCP servers, OAuth
      # Each session gets its own isolated sibling pair (seeded from the prototype
      # ~/.claude-container/ by export_compose_env) so concurrent sessions never
      # race on the same config files. DRYDOCK_SESSION_CLAUDE_DIR and
      # DRYDOCK_SESSION_CLAUDE_JSON are set per-session by export_compose_env.
      - "${DRYDOCK_SESSION_CLAUDE_DIR:?DRYDOCK_SESSION_CLAUDE_DIR not set — invoke via the drydock CLI}:${HOME}/.claude:rw"
      - "${DRYDOCK_SESSION_CLAUDE_JSON:?DRYDOCK_SESSION_CLAUDE_JSON not set — invoke via the drydock CLI}:${HOME}/.claude.json:rw"

      # ── Conversation history: SHARED append-only store (issue #68 root fix) ─
      # projects/<slug>/<uuid>.jsonl are append-only per-conversation logs — no
      # shared read-modify-write, no SQLite. Mounting them shared (not per-session)
      # is INV-2-compliant (see the INV-2 carve-out). This sub-mount overlays the
      # projects/ subdir of the per-session .claude mount above; declared AFTER it
      # so Compose creates the parent mount first. New & concurrent sessions all
      # see one history tree; gc_orphan_session_dirs' rm -rf of a per-session dir
      # can no longer reach durable history.
      - "${HOME}/.claude-container/projects:${HOME}/.claude/projects:rw"

      # ── Hooks: RO override (agent can't self-edit guardrails) ──────────────
      # Sources from the per-session seeded dir (DRYDOCK_SESSION_CLAUDE_DIR/hooks)
      # — NOT from host ${HOME}/.claude/hooks/. The per-session dir was just
      # mounted :rw above; this second mount overlays its hooks/ subpath with
      # itself plus :ro, making the agent unable to write its own hook scripts
      # (INV-3) while keeping the container blind to host ~/.claude/ entirely
      # (INV-2 — no host-direct exception). Sync flow: edit hooks on host →
      # 'drydock sync' rsync's them into the prototype → next session's
      # seed_session_config_dir copies them into the per-session dir → mount
      # picks them up. Existing sessions are sealed at startup; mid-session host
      # edits do not leak in (bounded blast radius under threat model A).
      - "${DRYDOCK_SESSION_CLAUDE_DIR:?DRYDOCK_SESSION_CLAUDE_DIR not set — invoke via the drydock CLI}/hooks:${HOME}/.claude/hooks:ro"

      # ── Binaries shared from host (claude, engram, gentle-ai, gga, uv) ─────
      - "${HOME}/.local:${HOME}/.local:rw"

      # ── Auth/identity ──────────────────────────────────────────────────────
      - "${HOME}/.gitconfig:${HOME}/.gitconfig:ro"
      - "${HOME}/.config/gh:${HOME}/.config/gh:rw"

      # ── Drydock hook scripts: RO, per-session sealed (INV-3 mounts #2 and #3) ──
      # Parallel to mount #1 above (the ~/.claude/hooks:ro overlay): sources
      # from the per-session seeded dir (DRYDOCK_SESSION_HOOKS_DIR), populated
      # at startup by seed_session_config_dir() from ${DRYDOCK_HOME}/templates/hooks/.
      # The baked SessionStart and PreToolUse entries in managed-settings.d/
      # reference absolute paths under /opt/drydock/hooks/; this mount delivers
      # the matching script contents. Existing sessions are sealed at startup;
      # mid-session host edits to templates/hooks/ do not leak in (bounded
      # blast radius under threat model A — same property as mount #1).
      - "${DRYDOCK_SESSION_HOOKS_DIR:?DRYDOCK_SESSION_HOOKS_DIR not set — invoke via the drydock CLI}:/opt/drydock/hooks:ro"
      # Re-mount :ro at the .claude/drydock-hooks path to override the parent .claude:rw mount.
      # DRYDOCK_SESSION_HOOKS_DIR is a subpath of DRYDOCK_SESSION_CLAUDE_DIR, so the parent :rw
      # mount exposes drydock-hooks/ as writable at ~/.claude/drydock-hooks/. This second mount
      # seals that inode alias — the agent cannot modify the hook scripts via the :rw path.
      # (Same pattern as mount #1's hooks overlay above.)
      - "${DRYDOCK_SESSION_HOOKS_DIR:?DRYDOCK_SESSION_HOOKS_DIR not set — invoke via the drydock CLI}:${HOME}/.claude/drydock-hooks:ro"

      # Optional opt-in overlays (activated by drydock CLI when detected):
      #   docker-compose.mcp-auth.yml      — ~/.mcp-auth/      (mcp-remote OAuth)
      #   docker-compose.ccstatusline.yml  — ~/.config/ccstatusline + ~/.cache
      # See lib/compose.sh:compose_files() for the detection logic.
