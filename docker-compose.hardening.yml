# drydock — container hardening overlay (v0.1.1+).
#
# Auto-included by lib/compose.sh:compose_files() UNLESS DRYDOCK_NO_HARDENING
# is set to the literal value "1" (nuclear opt-out per INV-8). Any other value
# — including "0", "false", or empty — retains hardening. Implements three
# accident-class defenses anchored in threat model A (INV-7):
#
#   1. cap_drop: ALL + minimum cap_add — bounds privileged syscall accidents
#      (e.g. a confused agent running `mount`, `ptrace`, or raw-socket bind).
#   2. security_opt: no-new-privileges:true — defeats sudo/SUID escalation,
#      ensuring the cap drop cannot be bypassed by an existing binary.
#   3. tmpfs /tmp size cap — bounds runaway-loop disk fill on the host's
#      tmpfs-backed memory; default 1g, tunable via DRYDOCK_TMPFS_SIZE.
#
# Each cap in cap_add is documented inline so removals require justification
# (per CLAUDE.md §3 and INV-8 invariant).

services:
  drydock:
    cap_drop:
      - ALL
    cap_add:
      # Kept in the bounding set so file-cap'd binaries (or anything that
      # ever needs to bypass file mode bits) still function. Common case:
      # npm/pnpm post-install scripts that chmod files under node_modules
      # without owning them — EACCES without DAC_OVERRIDE.
      - DAC_OVERRIDE
      # Bounding-set retention for ownership-changing operations: rsync -a
      # preserving uid/gid when copying user-owned trees, or any tool that
      # writes files on behalf of a different uid.
      - CHOWN
      # Companion to CHOWN — operations on files the process doesn't own
      # (FOWNER lets a privileged process bypass the "must own to chmod" check).
      - FOWNER
      # Bounding-set retention for any user-owned tool that opens uid-mismatched
      # files or needs to drop/elevate gid context. Real-world example: rsync
      # cross-uid metadata operations under DooD-launched ephemeral containers.
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:size=${DRYDOCK_TMPFS_SIZE:-1g}"
