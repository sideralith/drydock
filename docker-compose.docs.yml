# drydock — docs/ overlay.
#
# Applied via `docker compose -f docker-compose.yml -f docker-compose.docs.yml`
# when the target project has a docs/ subdirectory that's a separate filesystem
# mount (typically 9P drvfs from Windows on WSL2 setups).
#
# Belt-and-suspenders: the parent project mount SHOULD traverse the sub-mount,
# but Docker's bind-mount-of-bind-mount propagation on WSL2 is historically
# flaky. An explicit second mount of docs/ removes that risk.
#
# Activated automatically by the drydock CLI when:
#   1. ${PROJECT_DIR}/docs/ exists, AND
#   2. it's a separate filesystem mount (9P, NFS, etc.) — verified via `mount`

services:
  drydock:
    volumes:
      - "${PROJECT_DIR}/docs:${PROJECT_DIR}/docs:rw"
