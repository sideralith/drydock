# drydock egress-jail proxy config (Phase 2). Deny-by-default CONNECT allowlist.
# The allowlist file (/etc/tinyproxy/filter) is RO-mounted per session by drydock.

# Bind on all interfaces inside the sidecar (it has no external listener exposure —
# only the internal net reaches :8888, and only the agent is on that net).
Port 8888

# No LogFile directive: `LogFile /dev/null` errors on Debian tinyproxy (probe
# #3283 gotcha). Omitting LogFile routes tinyproxy output to stderr, which Docker
# captures. LogLevel Connect records every CONNECT attempt — useful for the
# empirical allowlist capture step (run with allow-all filter, collect hostnames).
LogLevel Connect

# Deny-by-default: a CONNECT whose host matches NO line in Filter is rejected 403.
FilterDefaultDeny Yes
# Extended POSIX regex, one host pattern per line, in the mounted file.
FilterType ere
Filter "/etc/tinyproxy/filter"
# Apply the filter to CONNECT (HTTPS tunnel) requests as well as plain HTTP.
FilterURLs Off

# Restrict CONNECT tunnels to 443 only — no plain-HTTP (80) CONNECT, no arbitrary
# ports. An IP-literal CONNECT (e.g. CONNECT 1.2.3.4:443) matches no host pattern
# under FilterDefaultDeny → 403. There is NO blanket Allow directive — adding one
# would open a hole; do not add one.
ConnectPort 443

# Do not leak a Via: header advertising the proxy.
DisableViaHeader Yes

# PidFile in /tmp so the sidecar can run read_only: true with a /tmp tmpfs (A5
# pre-emptive fix). Debian tinyproxy wants /run/tinyproxy (created by systemd-
# tmpfiles, which does not run in a container); /tmp is writeable via the tmpfs.
PidFile "/tmp/tinyproxy.pid"

# Reasonable bounds for a single-agent sidecar.
MaxClients 50
Timeout 600
