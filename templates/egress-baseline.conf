# drydock egress allowlist — SHIPPED BASELINE (Phase 2, contained mode).
#
# Deny-by-default: only hostnames matching a line here (extended POSIX regex, one
# per line) are reachable via CONNECT. This baseline is ALWAYS prepended to the
# effective filter; users can ADD domains (~/.config/drydock/egress-allowlist and
# egress-allowlist-<project>) but CANNOT weaken or remove these lines.
#
# Lines are ERE anchored host patterns. `#` comments and blank lines are stripped
# during effective-filter generation (lib/compose.sh). `\.` escapes a literal dot.
#
# PROVISIONAL — pending empirical capture (apply-phase pre-release gate for
# v0.4.0; see design §7 "empirical baseline capture"). Telemetry is OFF by
# default in contained mode (DISABLE_TELEMETRY=1 / DISABLE_ERROR_REPORTING=1),
# which collapses this to the essential set below.

# ── CONFIRMED required (Anthropic docs: code.claude.com/docs/en/network-config) ──
# Claude API + WebFetch domain-safety check both terminate here. HARD REQUIRED.
^api\.anthropic\.com$

# ── SUSPECTED required at startup — capture empirically before trusting ──
# Changelog feed / release notes / plugin-marketplace install counts.
^raw\.githubusercontent\.com$

# ── Browser-OAuth auth hosts ──
# Required ONLY when NOT using the drydock OAuth token path. drydock's default is
# token auth (`drydock setup-token` → CLAUDE_CODE_OAUTH_TOKEN injected), which does
# NOT need these. They ship COMMENTED so the token-auth default stays minimal;
# uncomment (or add to ~/.config/drydock/egress-allowlist) if you use browser auth.
#^claude\.ai$
#^platform\.claude\.com$

# NOTE: git/gh (github.com, api.github.com), npm (registry.npmjs.org), and any MCP
# server endpoints are NOT in the baseline — they are tool-triggered and vary by
# user. Add them to ~/.config/drydock/egress-allowlist as needed. See
# docs/troubleshooting.md "contained mode: domain not reachable".
